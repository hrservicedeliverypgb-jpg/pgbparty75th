<title>PGB Christmas Party 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--navy-900:#050b1f;--navy-800:#0b1838;--navy-700:#12234d;--gold:#d4a537;--gold-light:#f3d27a;--gold-dark:#a87b1c;--present:#16a34a;--present-bg:#e8f8ee;--absent:#dc2626;--absent-bg:#fdeeee;--ink:#111827;--muted:#6b7280;--line:#e5e7eb;--radius:16px;--shadow:0 10px 30px rgba(5,11,31,.18);--script:'Great Vibes',cursive;--sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{font-family:var(--sans);color:var(--ink);background:var(--navy-900);-webkit-font-smoothing:antialiased;min-height:100dvh}
body.mode-public,body.mode-login{background:radial-gradient(1200px 600px at 10% 110%,rgba(212,165,55,.18),transparent 60%),radial-gradient(900px 500px at 100% -10%,rgba(27,49,102,.9),transparent 60%),linear-gradient(180deg,var(--navy-800),var(--navy-900)) fixed}
body.mode-admin{background:#f3f4f8}
button,input,select,textarea{font:inherit}a{color:inherit}[hidden]{display:none!important}
#app{position:relative;z-index:1}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:12px;border:1px solid transparent;font-weight:600;cursor:pointer;text-decoration:none;transition:transform .1s,filter .15s,background .15s;white-space:nowrap}
.btn:active{transform:scale(.98)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-gold{background:linear-gradient(135deg,var(--gold-light),var(--gold) 55%,var(--gold-dark));color:var(--navy-900);box-shadow:0 6px 18px rgba(212,165,55,.35)}
.btn-gold:hover:not(:disabled){filter:brightness(1.06)}
.btn-ghost{background:transparent;border-color:rgba(255,255,255,.25);color:#fff}.btn-ghost:hover{background:rgba(255,255,255,.08)}
.btn-outline{background:#fff;border-color:var(--line);color:var(--ink)}.btn-outline:hover{background:#f8fafc}
.btn-danger{background:#fff;border-color:#fecaca;color:var(--absent)}.btn-danger:hover{background:var(--absent-bg)}
.btn-sm{padding:7px 12px;font-size:13px;border-radius:9px}.btn-block{width:100%}
.input,.select,textarea.input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);outline:none;transition:border .15s,box-shadow .15s}
.input:focus,.select:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(212,165,55,.25)}
.label{display:block;font-size:13px;font-weight:600;margin:0 0 6px;color:#374151}
.alert{padding:12px 14px;border-radius:12px;font-size:14px}
.alert-error{background:var(--absent-bg);color:#991b1b;border:1px solid #fecaca}
.alert-ok{background:var(--present-bg);color:#166534;border:1px solid #bbf7d0}
.alert-info{background:#eff6ff;color:#1e40af;border:1px solid #bfdbfe}
.spinner{width:22px;height:22px;border-radius:50%;border:3px solid rgba(212,165,55,.25);border-top-color:var(--gold);animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.center{display:grid;place-items:center;padding:60px 20px}
/* snow */
#snow{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;display:none}
body.mode-public #snow,body.mode-login #snow{display:block}
.flake{position:absolute;top:-10px;border-radius:50%;background:#fff;animation:fall linear infinite}
.flake.sparkle{background:var(--gold-light);box-shadow:0 0 8px 2px rgba(243,210,122,.7)}
@keyframes fall{0%{transform:translate3d(0,-10px,0)}50%{transform:translate3d(18px,50vh,0)}100%{transform:translate3d(-12px,105vh,0)}}
/* check-in */
.checkin-wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px;display:flex;flex-direction:column;gap:16px}
.banner{width:100%;border-radius:var(--radius);overflow:hidden;box-shadow:0 0 0 1px rgba(212,165,55,.35),var(--shadow)}
.banner img{display:block;width:100%;height:auto}
.event-meta{text-align:center}
.pill{display:inline-block;padding:6px 14px;border-radius:999px;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--gold-light);border:1px solid rgba(212,165,55,.45);background:rgba(212,165,55,.08)}
.card{background:#fff;border-radius:var(--radius);box-shadow:var(--shadow);padding:20px}
.card h2{margin:0 0 4px;font-size:20px;color:var(--navy-800)}
.sub{margin:0 0 16px;color:var(--muted);font-size:14px}
.step{display:flex;align-items:center;gap:10px;margin:18px 0 8px;font-weight:700;color:var(--navy-800)}
.step .num{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:13px;background:var(--navy-800);color:var(--gold-light)}
.name-list{margin-top:10px;max-height:320px;overflow-y:auto;border:1px solid var(--line);border-radius:12px;-webkit-overflow-scrolling:touch}
.name-item{display:flex;align-items:center;gap:12px;width:100%;padding:13px 14px;border:0;border-bottom:1px solid var(--line);background:#fff;text-align:left;cursor:pointer;color:var(--ink)}
.name-item:last-child{border-bottom:0}.name-item:hover{background:#fafaf5}
.name-item.selected{background:#fff8e6;box-shadow:inset 4px 0 0 var(--gold)}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid #cbd5e1;flex:none;display:grid;place-items:center}
.selected .radio{border-color:var(--gold)}.selected .radio::after{content:'';width:10px;height:10px;border-radius:50%;background:var(--gold)}
.nm{font-weight:600}.dp{font-size:12px;color:var(--muted)}
.empty{padding:24px;text-align:center;color:var(--muted);font-size:14px}
.footer-note{text-align:center;color:rgba(255,255,255,.55);font-size:12px}
/* result */
.result{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:24px;text-align:center;color:#fff;background:radial-gradient(800px 500px at 50% 40%,rgba(212,165,55,.25),transparent 65%),linear-gradient(180deg,var(--navy-800),var(--navy-900));animation:fadeIn .35s ease-out}
.result-inner{position:relative;z-index:2;max-width:520px;width:100%}
.result h1{font-family:var(--script);font-weight:400;font-size:clamp(58px,16vw,88px);margin:8px 0 0;color:var(--gold-light);line-height:1.1}
.who{font-size:clamp(22px,6vw,30px);font-weight:800;margin:10px 0 4px}
.aff{color:var(--gold-light);font-weight:600;margin-bottom:16px}
.thanks{font-size:17px;color:rgba(255,255,255,.85);margin:0 0 6px}
.rtime{font-size:13px;color:rgba(255,255,255,.6);margin-bottom:28px}
.check-anim{width:130px;height:130px;margin:0 auto;display:block}
.check-anim circle{stroke:var(--present);stroke-width:6;fill:rgba(22,163,74,.12);stroke-dasharray:380;stroke-dashoffset:380;animation:draw .7s ease-out forwards}
.check-anim path{stroke:#fff;stroke-width:9;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:110;stroke-dashoffset:110;animation:draw .45s .6s ease-out forwards}
.check-anim.warn circle{stroke:var(--gold);fill:rgba(212,165,55,.12)}
.pop{animation:pop .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.rise{opacity:0;animation:rise .6s ease-out forwards}.d1{animation-delay:.7s}.d2{animation-delay:.9s}.d3{animation-delay:1.1s}.d4{animation-delay:1.3s}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.confetti{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:confetti 3.2s ease-in forwards}
@keyframes confetti{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:.2}}
/* admin */
.admin-header{position:sticky;top:0;z-index:20;color:#fff;background:linear-gradient(90deg,rgba(5,11,31,.96),rgba(11,24,56,.92)),var(--banner) center/cover;border-bottom:2px solid var(--gold)}
.admin-header-inner{max-width:1400px;margin:0 auto;padding:12px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:auto}
.b1{font-weight:800;letter-spacing:.06em;color:var(--gold-light);font-size:15px}
.b2{font-family:var(--script);font-size:24px;color:#fff}
.admin-nav{display:flex;gap:4px;flex-wrap:wrap}
.admin-nav a,.admin-nav button{padding:8px 12px;border-radius:9px;font-size:14px;font-weight:600;color:rgba(255,255,255,.8);text-decoration:none;background:none;border:0;cursor:pointer}
.admin-nav a:hover,.admin-nav button:hover{background:rgba(255,255,255,.08);color:#fff}
.admin-nav a.active{background:rgba(212,165,55,.18);color:var(--gold-light)}
.admin-main{max-width:1400px;margin:0 auto;padding:20px;display:flex;flex-direction:column;gap:18px}
.page-title{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.page-title h1{margin:0;font-size:22px;color:var(--navy-800);margin-right:auto}
.live{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;background:#fff;border:1px solid var(--line)}
.live .dot{width:9px;height:9px;border-radius:50%;background:#9ca3af}
.live.on .dot{background:var(--present);animation:pulse 1.6s infinite}.live.off .dot{background:var(--absent)}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(22,163,74,.6)}70%{box-shadow:0 0 0 9px rgba(22,163,74,0)}100%{box-shadow:0 0 0 0 rgba(22,163,74,0)}}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.kpi{background:#fff;border-radius:var(--radius);padding:18px;border:1px solid var(--line);position:relative;overflow:hidden}
.kpi::before{content:'';position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--navy-700)}
.kpi.present::before{background:var(--present)}.kpi.absent::before{background:var(--absent)}.kpi.rate::before{background:var(--gold)}
.kpi .k{font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-size:34px;font-weight:800;color:var(--navy-800);margin-top:6px;font-variant-numeric:tabular-nums}
.kpi.present .v{color:var(--present)}.kpi.absent .v{color:var(--absent)}
.progress{height:8px;background:#eef0f5;border-radius:99px;overflow:hidden;margin-top:10px}
.progress>span{display:block;height:100%;background:linear-gradient(90deg,var(--gold),var(--present));transition:width .6s ease}
.panel{background:#fff;border-radius:var(--radius);border:1px solid var(--line);overflow:hidden}
.panel-head{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.panel-head h3{margin:0;font-size:16px;color:var(--navy-800);margin-right:auto}
.panel-body{padding:18px}
.grid-2{display:grid;grid-template-columns:2fr 1fr;gap:18px}
.table-wrap{overflow:auto;max-height:70vh}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{position:sticky;top:0;z-index:1;background:var(--navy-800);color:var(--gold-light);text-align:left;font-weight:600;padding:10px 12px;white-space:nowrap;font-size:13px}
table.t th[data-sort]{cursor:pointer;user-select:none}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
.num{text-align:right!important;font-variant-numeric:tabular-nums}
tr.row-present td{background:var(--present-bg)}
tr.row-absent td:first-child{box-shadow:inset 4px 0 0 var(--absent)}
tr.row-present td:first-child{box-shadow:inset 4px 0 0 var(--present)}
tr.flash td{animation:flash 3.5s ease-out}
@keyframes flash{0%,25%{background:#86efac}100%{background:var(--present-bg)}}
tr.clickable{cursor:pointer}tr.clickable:hover td{background:#fafaf5}tr.active-aff td{background:#fff8e6!important}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap}
.badge::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.badge-present{background:#dcfce7;color:#166534}.badge-pending{background:#fef3c7;color:#92400e}.badge-admin{background:#fff3d6;color:#8a5a00}.badge-monitor{background:#e0e7ff;color:#3730a3}.badge-absent{background:#fee2e2;color:#991b1b}
.mini-bar{width:80px;height:6px;background:#eef0f5;border-radius:99px;overflow:hidden;display:inline-block;vertical-align:middle;margin-left:8px}
.mini-bar>span{display:block;height:100%;background:var(--present)}
.filters{display:grid;grid-template-columns:2fr 1fr 1fr;gap:10px}
.feed{list-style:none;margin:0;padding:0}
.feed li{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);font-size:14px}
.feed li:last-child{border-bottom:0}.feed .tm,.feed .a{color:var(--muted);font-size:12px;white-space:nowrap}
.toasts{position:fixed;right:16px;bottom:16px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast{background:var(--navy-800);color:#fff;padding:12px 16px;border-radius:12px;box-shadow:var(--shadow);border-left:4px solid var(--present);font-size:14px;animation:rise .3s ease-out forwards;max-width:340px}
.toast b{color:var(--gold-light)}
.login-wrap{min-height:100dvh;display:grid;place-items:center;padding:20px}
.login-card{width:100%;max-width:400px}
.login-type{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 14px}.login-type button{padding:11px 8px;border-radius:10px;border:2px solid var(--gold);background:#fff;color:var(--navy-800);font-weight:700;font-size:15px;cursor:pointer}.login-type button.on{background:var(--gold);color:var(--navy-900)}.login-type #hrBtn{background:#fff6d6;border-color:#f3d27a}.login-type #hrBtn.on{background:#fbe7a6;border-color:var(--gold)}
.login-links{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:14px;font-size:13px}.login-links a{color:var(--navy-700);font-weight:600}
.whoami{width:100%;font-size:12px;color:rgba(255,255,255,.7);text-align:right;margin-top:-6px}
.role-chip{display:inline-block;margin-left:6px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.12);color:#fff;font-weight:700}
.role-chip.admin{background:rgba(212,165,55,.25);color:var(--gold-light)}
.login-card .title{font-family:var(--script);font-size:42px;color:var(--navy-800);margin:0;font-weight:400}
.dropzone{border:2px dashed #cbd5e1;border-radius:var(--radius);padding:32px;text-align:center;background:#fafbfd;cursor:pointer;transition:border .15s,background .15s}
.dropzone:hover,.dropzone.drag{border-color:var(--gold);background:#fffbef}
.form-row{display:grid;grid-template-columns:repeat(5,1fr) auto;gap:10px;align-items:end}

// One app for everyone: index.html = employee check-in, index.html#/admin = HR backend.
// admin.html is only a shortcut that forwards to index.html#/admin.
const APP_MODE = 'guest';
// Address of the employee check-in page (what the QR code opens):
// always index.html on the check-in screen (choose affiliate → name → submit)
function guestUrl() {
  return pageUrl().replace(/\/index\.html$/, '') + '/index.html#/checkin';
}
// Address of the HR / monitor login
function adminUrl() {
  return pageUrl().replace(/\/index\.html$/, '') + '/admin.html';
}

// Password roles (v4 adds HR). Also shown on its own as the HR upgrade script.
const PIN_ROLE_SQL = `-- ===================== PASSWORD ROLES (v4: adds HR) =====================
--   admin_pin_hash   -> full access (masterlist upload, clear, undo, passwords)
--   monitor_pin_hash -> live dashboard + exports (view only)
--   hr_pin_hash      -> dashboard: view and search names only
create or replace function public._pin_role(p_pin text) returns text
language sql stable security definer set search_path = public, extensions as $$
  select case
    when exists (select 1 from public.app_settings where key = 'admin_pin_hash'   and value = crypt(coalesce(p_pin,''), value)) then 'admin'
    when exists (select 1 from public.app_settings where key = 'monitor_pin_hash' and value = crypt(coalesce(p_pin,''), value)) then 'monitor'
    when exists (select 1 from public.app_settings where key = 'hr_pin_hash'      and value = crypt(coalesce(p_pin,''), value)) then 'hr'
  end;
$$;

create or replace function public.admin_change_pin(p_pin text, p_which text, p_new text) returns void
language plpgsql volatile security definer set search_path = public, extensions as $$
begin
  perform public._require_pin(p_pin, true);
  if p_which not in ('admin','monitor','hr') then raise exception 'Invalid password type'; end if;
  if length(coalesce(p_new,'')) < 2 then raise exception 'Password too short'; end if;
  insert into public.app_settings (key, value) values (p_which || '_pin_hash', crypt(p_new, gen_salt('bf')))
  on conflict (key) do update set value = excluded.value;
end $$;
`;
const CLEAR_CHECKINS_SQL = `
-- Clear check-ins only (keeps the masterlist names)
create or replace function public.admin_clear_checkins(p_pin text) returns void
language plpgsql volatile security definer set search_path = public as $$
begin
  perform public._require_pin(p_pin, true);
  delete from public.attendance where true;
  update public.employees set status = 'Not Yet Arrived', checked_in_at = null where status <> 'Not Yet Arrived' or checked_in_at is not null;
end $$;
grant execute on function public.admin_clear_checkins(text) to anon, authenticated;
`;

create or replace function public.check_in(p_employee_id uuid, p_user_agent text default null)
returns json language plpgsql security definer set search_path = public as $$
declare e public.employees%rowtype; a public.attendance%rowtype; v_now timestamptz := now(); v_name text;
begin
  select * into e from public.employees where id = p_employee_id for update;
  if not found then return json_build_object('status','not_found'); end if;
  v_name := e.last_name || ', ' || e.first_name;
  select * into a from public.attendance where employee_id = p_employee_id;
  if found then
    return json_build_object('status','already','name',v_name,'affiliate',e.affiliate,'checked_in_at',a.checked_in_at);
  end if;
  insert into public.attendance (employee_id, employee_code, employee_name, affiliate, check_in_date, check_in_time, checked_in_at, user_agent)
  values (e.id, e.employee_code, v_name, e.affiliate,
          (v_now at time zone 'Asia/Manila')::date, (v_now at time zone 'Asia/Manila')::time(0), v_now, left(p_user_agent, 300));
  update public.employees set status = 'Present', checked_in_at = v_now where id = e.id;
  return json_build_object('status','ok','name',v_name,'affiliate',e.affiliate,'checked_in_at',v_now);
exception when unique_violation then
  return json_build_object('status','already','name',v_name,'affiliate',e.affiliate,'checked_in_at',v_now);
end $$;

  delete from public.attendance where employee_id = p_employee_id;
  update public.employees set status = 'Not Yet Arrived', checked_in_at = null where id = p_employee_id;
end $$;

-- Login check (slows down wrong guesses)
create or replace function public.pin_role(p_pin text) returns text
language plpgsql volatile security definer set search_path = public, extensions as $$
declare r text;
begin
  r := public._pin_role(p_pin);
  if r is null then perform pg_sleep(1); end if;
  return r;
end $$;

create or replace function public._require_pin(p_pin text, p_admin boolean) returns text
language plpgsql stable security definer set search_path = public, extensions as $$
declare r text;
begin
  r := public._pin_role(p_pin);
  if r is null then raise exception 'INVALID_PIN' using errcode = '28000'; end if;
  if p_admin and r <> 'admin' then raise exception 'NOT_ADMIN' using errcode = '42501'; end if;
  return r;
end $$;

create or replace function public.admin_upsert_employees(p_pin text, p_rows jsonb) returns integer
language plpgsql volatile security definer set search_path = public as $$
declare n integer;
begin
  perform public._require_pin(p_pin, true);
  insert into public.employees (employee_code, last_name, first_name, affiliate, department)
  select upper(trim(r->>'employee_code')), trim(r->>'last_name'), trim(r->>'first_name'),
         trim(r->>'affiliate'), nullif(trim(coalesce(r->>'department','')), '')
  from jsonb_array_elements(p_rows) r
  where coalesce(trim(r->>'employee_code'),'') <> ''
  on conflict (employee_code) do update
    set last_name = excluded.last_name, first_name = excluded.first_name,
        affiliate = excluded.affiliate, department = excluded.department;
  get diagnostics n = row_count;
  return n;
end $$;

end $$;

function summarize(rows) {
  const m = new Map();
  for (const e of rows) {
    const s = m.get(e.affiliate) || { affiliate: e.affiliate, total: 0, present: 0 };
    s.total++; if (e.status === 'Present') s.present++;
    m.set(e.affiliate, s);
  }
  return [...m.values()].map((s) => ({ ...s, absent: s.total - s.present, rate: pct(s.present, s.total) }))
    .sort((a, b) => a.affiliate.localeCompare(b.affiliate));
}

    const s = document.createElement('script');
    s.src = src; s.onload = res;
    s.onerror = () => { delete loaded[src]; rej(new Error('Could not load a required library. Check your internet connection.')); };
    document.head.appendChild(s);

}

/** Pages through any Supabase query builder past the 1,000-row limit. */
async function fetchAll(makeQuery) {
  const size = 1000, out = [];
  for (let from = 0; ; from += size) {
    const { data, error } = await makeQuery().range(from, from + size - 1);
    if (error) throw error;
    out.push(...(data || []));
    if (!data || data.length < size) break;
  }
  return out;
}

// Captured before Supabase reads (and clears) login links such as email confirmation / password reset
const INITIAL_HASH = location.hash;
let authLinkPending = /access_token=|type=recovery|type=signup|error_description=/.test(INITIAL_HASH);
const IS_RECOVERY_LINK = /type=recovery/.test(INITIAL_HASH);
const CONFIGURED = Boolean(CONFIG.SUPABASE_URL && CONFIG.SUPABASE_ANON_KEY);
const sb = CONFIGURED && window.supabase
  ? window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_ANON_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, storageKey: 'pgb-xmas-admin' },
    })
  : null;

/* ------------------------------ router ------------------------------ */
let cleanup = null;
let routeId = 0;
function route() {
  routeId++;
  if (cleanup) { try { cleanup(); } catch (_) {} cleanup = null; }
  window.scrollTo(0, 0);
  let h = location.hash.replace(/^#\/?/, '');
  if (APP_MODE === 'admin' && !h.startsWith('admin')) h = 'admin';
  if (!CONFIGURED) return renderSetup();
  if (!window.supabase) { app.innerHTML = '<div class="center" style="color:#fff">Could not load. Please check your internet connection and refresh.</div>'; return; }
  if (authLinkPending) {
    // Arrived from an email link: wait for Supabase to finish signing in
    if (/error_description=/.test(INITIAL_HASH)) {
      authLinkPending = false;
      const msg = decodeURIComponent((INITIAL_HASH.match(/error_description=([^&]*)/) || [])[1] || '').replace(/\+/g, ' ');
      history.replaceState(null, '', location.pathname + location.search + '#/admin');
      return renderLogin('signin', `That link is no longer valid (${msg || 'expired'}). Please try again.`);
    }
    document.body.className = 'mode-login';
    app.innerHTML = '<div class="center" style="min-height:100dvh"><div class="spinner"></div></div>';
    setTimeout(() => { if (authLinkPending) { authLinkPending = false; location.hash = '#/admin'; route(); } }, 6000);
    return;
  }
  if (h.startsWith('admin')) return renderAdmin(h, routeId);
  renderCheckin();
}
window.addEventListener('hashchange', route);
if (sb) sb.auth.onAuthStateChange((evt) => {
  if (evt === 'PASSWORD_RECOVERY' || (IS_RECOVERY_LINK && authLinkPending && evt === 'SIGNED_IN')) {
    authLinkPending = false;
    history.replaceState(null, '', location.pathname + location.search + '#/admin');
    return renderNewPassword();
  }
  if (evt === 'SIGNED_IN' && authLinkPending) {
    authLinkPending = false;
    history.replaceState(null, '', location.pathname + location.search + '#/admin');
    return route();
  }
  if (evt === 'SIGNED_OUT' && location.hash.startsWith('#/admin')) route();
});

      <div id="affBox"><div style="display:flex;gap:10px;align-items:center;color:var(--muted)"><div class="spinner"></div> Loading…</div></div>
      <div id="nameStep" hidden>
        <div class="step"><span class="num">2</span> Your name</div>
        <input class="input" id="search" type="search" placeholder="Type to search your name…" autocomplete="off">
        <div class="name-list" id="names" role="listbox" aria-label="Employee names"></div>
      </div>
      <div id="err"></div>
      <div style="margin-top:18px"><button class="btn btn-gold btn-block" id="submitBtn" disabled>Submit</button></div>
    </section>
    <p class="footer-note">Can’t find your name? Please approach the registration desk.<br>© ${new Date().getFullYear()} ${esc(CONFIG.COMPANY)}</p>
  </main>`;

  const st = { employees: [], selected: null, busy: false, token: 0 };
  const showErr = (m) => { $('#err').innerHTML = m ? `<div class="alert alert-error" style="margin-top:14px">${esc(m)}</div>` : ''; };
  const updateBtn = () => {
    const b = $('#submitBtn');
    b.disabled = !st.selected || st.busy;
    b.textContent = st.busy ? 'Recording…' : st.selected ? `Submit — ${fullName(st.selected)}` : 'Submit';
  };
  const drawNames = () => {
    const q = $('#search').value.trim().toLowerCase();
    const list = q ? st.employees.filter((e) => `${e.last_name} ${e.first_name} ${e.first_name} ${e.last_name}`.toLowerCase().includes(q)) : st.employees;
    $('#names').innerHTML = list.length
      ? list.map((e) => `
        <button type="button" role="option" class="name-item ${st.selected && st.selected.id === e.id ? 'selected' : ''}" data-id="${e.id}">
          <span class="radio"></span>
          <span><div class="nm">${esc(fullName(e))}</div>${e.department ? `<div class="dp">${esc(e.department)}</div>` : ''}</span>
        </button>`).join('')
      : `<div class="empty">${st.employees.length ? 'No match. Try your last name.' : 'No names found for this affiliate.'}</div>`;
  };

  async function loadAffiliates() {
    try {
      const rows = await fetchAll(() => sb.rpc('get_affiliates'));
      $('#affBox').innerHTML = `<select class="select" id="aff" aria-label="Affiliate">
        <option value="">— Select your affiliate —</option>
        ${rows.map((r) => `<option value="${esc(r.affiliate)}">${esc(r.affiliate)}</option>`).join('')}</select>`;
      $('#aff').onchange = (e) => loadNames(e.target.value);
    } catch (e) {
      $('#affBox').innerHTML = `<button class="btn btn-outline btn-block" id="retry">Retry</button>`;
      $('#retry').onclick = loadAffiliates;
      showErr('Unable to load affiliates. Please check your connection.');
    }
  }

  async function loadNames(aff) {
    const token = ++st.token;
    st.selected = null; st.employees = []; updateBtn(); showErr('');
    $('#search').value = '';
    if (!aff) { $('#nameStep').hidden = true; return; }
    $('#nameStep').hidden = false;
    $('#names').innerHTML = spinner;
    try {
      const rows = await fetchAll(() => sb.rpc('get_employees_by_affiliate', { p_affiliate: aff }));
      if (token !== st.token) return;
      st.employees = rows; drawNames();
    } catch (e) {
      if (token === st.token) { $('#names').innerHTML = ''; showErr('Unable to load names. Please try again.'); }
    }
  }

  $('#search').oninput = drawNames;
  $('#names').onclick = (ev) => {
    const b = ev.target.closest('.name-item'); if (!b) return;
    st.selected = st.employees.find((x) => x.id === b.dataset.id) || null;
    drawNames(); updateBtn();
  };
  $('#submitBtn').onclick = async () => {
    if (!st.selected || st.busy) return;
    st.busy = true; updateBtn(); showErr('');
    try {
      const { data, error } = await sb.rpc('check_in', { p_employee_id: st.selected.id, p_user_agent: navigator.userAgent.slice(0, 300) });
      if (error) throw error;
      if (data.status === 'ok') showResult('welcome', data, reset);
      else if (data.status === 'already') showResult('already', data, reset);
      else showErr('Employee record not found. Please approach the registration desk.');
    } catch (e) {
      showErr('We could not record your attendance. Please check your connection and try again.');
    } finally {
      st.busy = false; updateBtn();
    }
  };
  function reset() {
    const sel = $('#aff'); if (sel) sel.value = '';
    loadNames('');
  }
  loadAffiliates();
}

function showResult(kind, r, onDone) {
  const welcome = kind === 'welcome';

  const confetti = welcome
    ? `<div class="confetti" aria-hidden="true">${Array.from({ length: 70 }, () =>

    : '';
  const el = document.createElement('div');
  el.className = 'result'; el.setAttribute('role', 'dialog'); el.setAttribute('aria-live', 'assertive');
  el.innerHTML = `${confetti}
    <div class="result-inner">
      <svg class="check-anim pop ${welcome ? '' : 'warn'}" viewBox="0 0 130 130" aria-hidden="true">
        <circle cx="65" cy="65" r="58"></circle>
        ${welcome ? '<path d="M38 67 L57 86 L93 47"></path>' : '<path d="M65 38 L65 74 M65 92 L65 93"></path>'}
      </svg>

        <div class="aff rise d2">${esc(r.name)} · ${esc(r.affiliate)}</div>

}

/* =========================== ADMIN =========================== */
let ME = null; // { email, full_name, role: 'admin'|'monitor'|'hr', affiliate|null }
const ROLE_LABEL = { admin: 'Admin', monitor: 'Monitor · view only', hr: 'HR · view & search' };


/* Password-only admin access. Admin password = full access, Monitor password = view only. */
const PIN_KEY = 'pgb-xmas-pin';
function getPin() { try { return sessionStorage.getItem(PIN_KEY) || localStorage.getItem(PIN_KEY) || ''; } catch (_) { return ''; } }
function savePin(p, remember) {
  try { sessionStorage.setItem(PIN_KEY, p); if (remember) localStorage.setItem(PIN_KEY, p); else localStorage.removeItem(PIN_KEY); } catch (_) {}
}
function clearPin() { try { sessionStorage.removeItem(PIN_KEY); localStorage.removeItem(PIN_KEY); } catch (_) {} }
function signOut() { clearPin(); ME = null; route(); }
async function adminRpc(fn, args = {}) {
  const { data, error } = await sb.rpc(fn, { p_pin: getPin(), ...args });
  if (error) {
    if (/INVALID_PIN|NOT_ADMIN/.test(error.message || '')) {
      if (/INVALID_PIN/.test(error.message)) { clearPin(); setTimeout(route, 0); }
      throw new Error(/NOT_ADMIN/.test(error.message) ? 'Only the Admin password can do this.' : 'Your session ended. Please log in again.');
    }
    throw error;
  }
  return data;
}

async function renderAdmin(h, rid) {
  document.body.className = 'mode-admin';
  app.innerHTML = '<div class="center" style="min-height:100dvh"><div class="spinner"></div></div>';
  const pin = getPin();
  if (!pin) return renderPinLogin();
  const { data: role, error } = await sb.rpc('pin_role', { p_pin: pin });
  if (rid !== routeId) return;
  if (error) {
    if (error.code === 'PGRST202' || /pin_role/.test(error.message || '')) return renderUpgrade();
    app.innerHTML = `<div class="setup"><div class="alert alert-error">Could not connect: ${esc(error.message)} <button class="btn btn-outline btn-sm" onclick="location.reload()">Retry</button></div></div>`;
    return;
  }
  if (!role) { clearPin(); return renderPinLogin('Password changed or incorrect. Please log in again.'); }
  let role2 = role;
  if (role !== 'admin' && pin === CONFIG.HR_ACCESS_PASSWORD) role2 = 'hr'; // came in through the HR access button
  if (role === 'admin') ensureHrAccess(); // first Admin login turns on the HR access button
  ME = { role: role2, full_name: role2 === 'admin' ? 'Admin' : role2 === 'hr' ? 'HR' : 'Monitor', email: '', affiliate: null };
  const isAdmin = role2 === 'admin', isHr = role2 === 'hr';

  const pages = { 'admin/upload': 'upload', 'admin/qr': 'qr', 'admin/settings': 'settings', 'admin/raffle': 'raffle' };
  let page = pages[h] || 'dash';
  if (!isAdmin && (page === 'upload' || page === 'settings' || page === 'raffle')) page = 'dash';
  if (isHr) page = 'dash'; // HR: view and search names only
  const nav = [['dash', '#/admin', 'Dashboard']];
  if (isAdmin) nav.push(['upload', '#/admin/upload', 'Masterlist']);
  if (isAdmin) nav.push(['raffle', '#/admin/raffle', 'Raffle']);
  if (!isHr) nav.push(['qr', '#/admin/qr', 'Event QR']);
  if (isAdmin) nav.push(['settings', '#/admin/settings', 'Passwords']);

  app.innerHTML = `
  <header class="admin-header">
    <div class="admin-header-inner">
      <div class="brand"><span class="b1">PRIMARY GROUP OF BUILDERS</span><span class="b2">Christmas Party Attendance</span></div>
      <nav class="admin-nav">
        ${nav.map(([k, href, l]) => `<a href="${href}" class="${k === page ? 'active' : ''}">${l}</a>`).join('')}
        ${isHr ? '' : `<a href="${esc(guestUrl())}" target="_blank" rel="noopener" title="Open the employee check-in page">Check-in page ↗</a>`}
        <button id="signOut">Log out</button>
      </nav>
      <div class="whoami"><span class="role-chip ${isAdmin ? 'admin' : ''}">${ROLE_LABEL[role2] || role2}</span></div>
    </div>
  </header>
  <main class="admin-main" id="adminMain"></main>`;
  $('#signOut').onclick = signOut;
  const main = $('#adminMain');
  if (page === 'upload') renderUpload(main);
  else if (page === 'settings') renderSettings(main);
  else if (page === 'qr') renderQr(main);
  else if (page === 'raffle') renderRaffle(main);
  else renderDashboard(main);
}

/* Makes the one-tap HR access work: saves CONFIG.HR_ACCESS_PASSWORD as the HR password
   (or, on databases without the HR role yet, as the view-only Monitor password). Runs on Admin login. */
async function ensureHrAccess() {
  try {
    const { data: r } = await sb.rpc('pin_role', { p_pin: CONFIG.HR_ACCESS_PASSWORD });
    if (r === 'hr' || r === 'monitor') return;
    let { error } = await sb.rpc('admin_change_pin', { p_pin: getPin(), p_which: 'hr', p_new: CONFIG.HR_ACCESS_PASSWORD });
    if (error) ({ error } = await sb.rpc('admin_change_pin', { p_pin: getPin(), p_which: 'monitor', p_new: CONFIG.HR_ACCESS_PASSWORD }));
    if (!error) toast('HR access is now turned on. The HR access button opens the dashboard.');
  } catch (_) {}
}

function renderPinLogin(notice = '') {
  document.body.className = 'mode-login';
  app.innerHTML = `
  <div class="login-wrap">
    <form class="card login-card" id="pinForm">
      <img src="${BANNER}" alt="" style="width:100%;border-radius:12px;display:block;margin-bottom:14px">

        <input class="input" id="pin" type="password" autocomplete="current-password" required autofocus>
        <label style="display:flex;gap:8px;align-items:center;margin-top:12px;font-size:14px;color:#374151">
          <input type="checkbox" id="remember" checked> Keep me logged in on this device
        </label>
      </div>
      <div id="hrOpening" hidden style="display:flex;gap:10px;align-items:center;justify-content:center;color:var(--muted);padding:14px 0"><div class="spinner"></div> Opening HR dashboard…</div>
      <div id="perr"></div>
      <button class="btn btn-gold btn-block" style="margin-top:16px" id="pbtn">Log in</button>
    </form>
  </div>`;
  setTimeout(() => $('#pin') && $('#pin').focus(), 50);
  const showErr = (m) => { $('#perr').innerHTML = `<div class="alert alert-error" style="margin-top:12px">${m}</div>`; };
  const enter = (p, remember) => {
    savePin(p, remember);
    if (!location.hash.startsWith('#/admin')) history.replaceState(null, '', location.pathname + location.search + '#/admin');
    route();
  };
  // Admin tab: password field.  HR tab: no password, opens right away.
  const showMode = (hr) => {
    $('#adminBtn').classList.toggle('on', !hr); $('#hrBtn').classList.toggle('on', hr);
    $('#adminFields').hidden = hr; $('#pbtn').hidden = hr; $('#hrOpening').hidden = !hr;
    $('#hrOpening').style.display = hr ? 'flex' : 'none';
    $('#pin').required = !hr; $('#perr').innerHTML = '';
    if (!hr) $('#pin').focus();
  };
  $('#hrOpening').style.display = 'none';
  $('#adminBtn').onclick = () => showMode(false);
  $('#hrBtn').onclick = async () => {
    showMode(true);
    const b = $('#hrBtn'); b.disabled = true;
    const { data: role, error } = await sb.rpc('pin_role', { p_pin: CONFIG.HR_ACCESS_PASSWORD });
    b.disabled = false;
    if (error || (role !== 'hr' && role !== 'monitor')) { $('#hrOpening').style.display = 'none'; }
    if (error) return error.code === 'PGRST202' ? renderUpgrade() : showErr(`Connection problem: ${esc(error.message)}`);
    if (role !== 'hr' && role !== 'monitor') return renderHrNames(); // not set up yet: open the names list anyway
    enter(CONFIG.HR_ACCESS_PASSWORD, false);
  };
  $('#pinForm').onsubmit = async (e) => {
    e.preventDefault();
    const p = $('#pin').value;
    if (!p) return;
    const btn = $('#pbtn'); btn.disabled = true; btn.textContent = 'Checking…';
    const { data: role, error } = await sb.rpc('pin_role', { p_pin: p });
    btn.disabled = false; btn.textContent = 'Log in';
    if (error) return error.code === 'PGRST202' ? renderUpgrade() : showErr(`Connection problem: ${esc(error.message)}`);
    if (!role || role === 'hr') { showErr('Wrong Admin password. Please try again.'); $('#pin').select(); return; }
    enter(p, $('#remember').checked);
  };
}

      </div>
      <p style="text-align:center;margin:10px 0 0"><a href="${esc(guestUrl())}" style="color:var(--muted);font-size:13px">Guest check-in page</a></p>
    </form>
  </div>`;
  document.querySelectorAll('[data-mode]').forEach((a) => a.onclick = (ev) => { ev.preventDefault(); renderLogin(a.dataset.mode); });
  const show = (kind, m) => { $('#lerr').innerHTML = `<div class="alert ${kind}" style="margin-top:12px">${esc(m)}</div>`; };
  $('#loginForm').onsubmit = async (e) => {
    e.preventDefault();
    const email = $('#em').value.trim().toLowerCase();
    const pw = $('#pw') ? $('#pw').value : '';
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return show('alert-error', 'Please enter a valid email.');
    const btn = $('#lbtn'); const label = btn.textContent; btn.disabled = true; btn.textContent = 'Please wait…';
    const done = () => { btn.disabled = false; btn.textContent = label; };
    if (mode === 'signin') {
      const { error } = await sb.auth.signInWithPassword({ email, password: pw });
      if (!error) return route();
      done();
      return show('alert-error', /confirm/i.test(error.message) ? 'Please confirm your email first (check your inbox), then sign in.' : 'Invalid email or password.');
    }
    if (mode === 'signup') {
      if (pw.length < 8) { done(); return show('alert-error', 'Password must be at least 8 characters.'); }
      if (pw !== $('#pw2').value) { done(); return show('alert-error', 'Passwords do not match.'); }
      const { data, error } = await sb.auth.signUp({ email, password: pw, options: { emailRedirectTo: pageUrl() } });
      done();
      if (error) {
        if (/database error|EMAIL_NOT_ON_PERSONNEL_LIST/i.test(error.message)) return show('alert-error', 'This email is not on the monitoring personnel list. Please ask HR to add you first.');
        if (/already registered|already exists/i.test(error.message)) return show('alert-error', 'You already have an account. Please sign in instead.');
        return show('alert-error', error.message);
      }
      if (data.session) return route();
      return show('alert-ok', 'Account created! Check your inbox for the confirmation email, click the link, then sign in here.');
    }
    const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: pageUrl() });
    done();
    if (error) return show('alert-error', error.message);
    show('alert-ok', 'If this email has an account, a reset link is on its way. Open it on this device.');
  };
}

        ${ME && ME.role === 'hr' ? '' : `<button class="btn btn-outline btn-sm" id="xlsxBtn">⬇ Excel</button>

  const scope = () => (st.aff === 'All' ? all() : all().filter((e) => e.affiliate === st.aff));
  function visibleRows() {

        || `${e.last_name}, ${e.first_name} ${e.first_name} ${e.last_name}`.toLowerCase().includes(n)
        || e.affiliate.toLowerCase().includes(n);
    });
    const cmp = {
      recent: (a, b) => (b.checked_in_at || '').localeCompare(a.checked_in_at || '') || byName(a, b),
      id: (a, b) => a.employee_code.localeCompare(b.employee_code, undefined, { numeric: true }),

    return [st.aff === 'All' ? 'All affiliates' : st.aff, st.status === 'All' ? 'All statuses' : st.status, st.q.trim() ? `Search "${st.q.trim()}"` : '']

      <div class="kpi"><div class="k">Total Invited</div><div class="v">${total.toLocaleString()}</div></div>
      <div class="kpi present"><div class="k">Present</div><div class="v">${present.toLocaleString()}</div></div>
      <div class="kpi absent"><div class="k">Absent</div><div class="v">${(total - present).toLocaleString()}</div></div>
      <div class="kpi rate"><div class="k">Attendance Rate</div><div class="v">${rate}%</div><div class="progress"><span style="width:${rate}%"></span></div></div>`;

    const sum = summarize(rowsAll);
    $('#affBody').innerHTML = sum.length ? sum.map((s) => `
      <tr class="clickable ${st.aff === s.affiliate ? 'active-aff' : ''}" data-aff="${esc(s.affiliate)}" title="Click to filter">
        <td style="font-weight:600">${esc(s.affiliate)}</td><td class="num">${s.total}</td>
        <td class="num" style="color:var(--present);font-weight:700">${s.present}</td>
        <td class="num" style="color:var(--absent);font-weight:700">${s.absent}</td>
        <td>${s.rate}%<span class="mini-bar"><span style="width:${s.rate}%"></span></span></td>
      </tr>`).join('') : '<tr><td colspan="5" class="empty">No masterlist uploaded yet.</td></tr>';
    $('#showAll').hidden = st.aff === 'All';

    const affSel = $('#affSel');
    const affs = sum.map((s) => s.affiliate);
    const opts = ['All', ...affs].join('|');
    if (affSel.dataset.opts !== opts) {
      affSel.innerHTML = '<option value="All">All affiliates</option>' + affs.map((a) => `<option value="${esc(a)}">${esc(a)}</option>`).join('');
      affSel.dataset.opts = opts;
    }
    affSel.value = st.aff;

    const recent = rowsAll.filter((e) => e.checked_in_at).sort((a, b) => b.checked_in_at.localeCompare(a.checked_in_at)).slice(0, 10);
    $('#feed').innerHTML = recent.length ? recent.map((e) => `
      <li><span><b>${esc(fullName(e))}</b><br><span class="a">${esc(e.affiliate)}</span></span><span class="tm">${fmtTime(e.checked_in_at)}</span></li>`).join('')
      : '<li class="empty" style="justify-content:center">Waiting for the first guest…</li>';

    const rows = visibleRows();
    $('#count').textContent = `(${rows.length.toLocaleString()})`;
    document.querySelectorAll('th[data-sort]').forEach((th) => {
      th.textContent = th.textContent.replace(' ▾', '') + (th.dataset.sort === st.sort ? ' ▾' : '');
    });
    $('#tbody').innerHTML = rows.length ? rows.map((e) => {
      const p = e.status === 'Present';
      return `<tr class="${p ? 'row-present' : 'row-absent'} ${st.flash.has(e.id) ? 'flash' : ''}">
        <td>${esc(e.employee_code)}</td><td style="font-weight:600">${esc(fullName(e))}</td><td>${esc(e.affiliate)}</td>
        <td>${p ? fmtTime(e.checked_in_at) : '—'}</td>
        <td><span class="badge ${p ? 'badge-present' : 'badge-absent'}">${p ? 'Present' : 'Not Yet Checked In'}</span></td>

      </tr>`;
    }).join('') : '<tr><td colspan="6" class="empty">No matching employees.</td></tr>';

  }

  function setLive(s) {
    st.live = s;
    const el = $('#live'); if (!el) return;
    el.className = 'live ' + (s === 'live' ? 'on' : s === 'offline' ? 'off' : '');
    el.lastElementChild.textContent = s === 'live' ? 'Live' : s === 'offline' ? 'Reconnecting…' : 'Connecting…';
  }

  async function load() {
    try {
      const rows = await fetchAll(() => sb.rpc('admin_employees', { p_pin: getPin() }));
      st.map = new Map(rows.map((r) => [r.id, r]));
      st.since = new Date(Date.now() - 10000).toISOString();
      setLive('live');
      $('#loadErr').innerHTML = '';
      draw();
    } catch (e) {
      $('#loadErr').innerHTML = `<div class="alert alert-error">Failed to load attendance: ${esc(e.message)}</div>`;
    }
  }

  // Events
  $('#refresh').onclick = load;
  $('#q').oninput = (e) => { st.q = e.target.value; schedule(); };
  $('#affSel').onchange = (e) => { st.aff = e.target.value; draw(); };
  $('#statusSel').onchange = (e) => { st.status = e.target.value; draw(); };
  $('#showAll').onclick = () => { st.aff = 'All'; draw(); };
  $('#affBody').onclick = (e) => {
    const tr = e.target.closest('tr[data-aff]'); if (!tr) return;
    st.aff = st.aff === tr.dataset.aff ? 'All' : tr.dataset.aff; draw();
  };
  document.querySelectorAll('th[data-sort]').forEach((th) => th.onclick = () => { st.sort = th.dataset.sort; draw(); });
  $('#tbody').onclick = async (e) => {
    const b = e.target.closest('[data-undo]'); if (!b) return;
    const emp = st.map.get(b.dataset.undo);
    if (!emp || !confirm(`Undo check-in for ${fullName(emp)}? They will be marked "Not Yet Arrived".`)) return;
    try { await adminRpc('admin_undo', { p_employee_id: emp.id }); poll(); } catch (err) { alert(err.message); }
  };
  if ($('#xlsxBtn')) $('#xlsxBtn').onclick = () => runExport('xlsx');
  if ($('#pdfBtn')) $('#pdfBtn').onclick = () => runExport('pdf');
  if ($('#clearNames')) $('#clearNames').onclick = async () => {
    if (prompt('This clears ALL check-ins. Everyone goes back to "Not Yet Arrived". The names in the masterlist are kept.\n\nType CLEAR to confirm.') !== 'CLEAR') return;
    const b = $('#clearNames'); b.disabled = true; b.textContent = 'Clearing…';
    try {
      const { error } = await sb.rpc('admin_clear_checkins', { p_pin: getPin() });
      if (error && (error.code === 'PGRST202' || /admin_clear_checkins/.test(error.message || ''))) {
        // Database not upgraded yet: undo each check-in one by one (same effect)
        const present = [...st.map.values()].filter((e) => e.status === 'Present');
        for (let i = 0; i < present.length; i += 10) {
          b.textContent = `Clearing… ${Math.min(i + 10, present.length)}/${present.length}`;
          await Promise.all(present.slice(i, i + 10).map((e) => adminRpc('admin_undo', { p_employee_id: e.id })));
        }
      } else if (error) {
        if (/INVALID_PIN|NOT_ADMIN/.test(error.message || '')) throw new Error('Only the Admin password can do this.');
        throw error;
      }
      toast('All check-ins were cleared. Names are kept.'); route();
    } catch (err) { alert(err.message); b.disabled = false; b.textContent = '🗑 Clear check-ins'; }
  };
  async function runExport(kind) {
    const btn = kind === 'xlsx' ? $('#xlsxBtn') : $('#pdfBtn');
    const label = btn.textContent; btn.disabled = true; btn.textContent = 'Exporting…';
    try { kind === 'xlsx' ? await exportExcel(visibleRows(), filterLabel()) : await exportPdf(visibleRows(), filterLabel()); }
    catch (e) { alert('Export failed: ' + e.message); }
    finally { btn.disabled = false; btn.textContent = label; }
  }

  // Live updates: ask the database every 3 seconds for anything that changed
  let polling = false;
  async function poll() {
    if (polling || !st.since) return;
    polling = true;
    try {
      const res = await adminRpc('admin_changes_since', { p_since: st.since });
      st.since = new Date(new Date(res.now).getTime() - 5000).toISOString();
      if (res.total !== st.map.size && !(res.rows || []).length) { polling = false; return load(); }
      for (const row of res.rows || []) {
        const prev = st.map.get(row.id);
        st.map.set(row.id, row);
        if (row.status === 'Present' && prev && prev.status !== 'Present') {
          st.flash.add(row.id);
          setTimeout(() => { st.flash.delete(row.id); }, 3600);
          toast(`🎄 <b>${esc(fullName(row))}</b> just checked in<br><span style="opacity:.7;font-size:12px">${esc(row.affiliate)}</span>`);
        }
      }
      if (res.total !== st.map.size) { polling = false; return load(); }
      if ((res.rows || []).length) schedule();
      setLive('live');
    } catch (err) {
      setLive('offline');
    } finally { polling = false; }
  }
  const timer = setInterval(poll, 3000);
  const onVisible = () => { if (document.visibilityState === 'visible') poll(); };
  document.addEventListener('visibilitychange', onVisible);
  cleanup = () => { clearInterval(timer); document.removeEventListener('visibilitychange', onVisible); };

  load();
}

/* --------------------------- Exports --------------------------- */
async function exportExcel(rows, filterLabel) {
  await loadScript(LIBS.xlsx);
  const data = rows.map((e, i) => ({
    '#': i + 1, 'Employee ID': e.employee_code, 'Employee Name': fullName(e), Affiliate: e.affiliate,
    Department: e.department || '', 'Attendance Status': e.status === 'Present' ? 'Present' : 'Not Yet Arrived',
    'Check-In Time': fmtDT(e.checked_in_at),
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  ws['!cols'] = [{ wch: 5 }, { wch: 14 }, { wch: 32 }, { wch: 24 }, { wch: 22 }, { wch: 18 }, { wch: 24 }];
  ws['!autofilter'] = { ref: `A1:G${data.length + 1}` };
  const sum = summarize(rows), present = rows.filter((r) => r.status === 'Present').length;
  const ws2 = XLSX.utils.json_to_sheet([
    ...sum.map((s) => ({ Affiliate: s.affiliate, 'Total Employees': s.total, Present: s.present, Absent: s.absent, 'Attendance %': s.rate })),
    { Affiliate: 'TOTAL', 'Total Employees': rows.length, Present: present, Absent: rows.length - present, 'Attendance %': pct(present, rows.length) },
  ]);
  ws2['!cols'] = [{ wch: 28 }, { wch: 16 }, { wch: 10 }, { wch: 10 }, { wch: 14 }];
  const ws3 = XLSX.utils.aoa_to_sheet([
    [`${CONFIG.COMPANY} — ${CONFIG.EVENT_SUBTITLE}`], [CONFIG.EVENT_NAME], ['Event date', CONFIG.EVENT_DATE],
    ['Report generated', fmtDT(new Date().toISOString())], ['Filter', filterLabel],
  ]);
  ws3['!cols'] = [{ wch: 20 }, { wch: 50 }];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Attendance');
  XLSX.utils.book_append_sheet(wb, ws2, 'Summary by Affiliate');
  XLSX.utils.book_append_sheet(wb, ws3, 'Report Info');
  XLSX.writeFile(wb, `PGB-Christmas-Party-Attendance-${fileStamp()}.xlsx`);
}

  doc.setFontSize(9);
  doc.text(`Attendance Report  •  Generated ${fmtDT(new Date().toISOString())}  •  Filter: ${filterLabel}`, 36, 68);
  doc.setTextColor(30, 30, 30); doc.setFontSize(11); doc.setFont('helvetica', 'bold');
  doc.text(`Total Invited: ${rows.length}     Present: ${present}     Absent: ${rows.length - present}     Attendance Rate: ${pct(present, rows.length)}%`, 36, 100);

    body: rows.map((e, i) => [i + 1, e.employee_code, fullName(e), e.affiliate, e.status === 'Present' ? 'Present' : 'Not Yet Arrived', fmtDT(e.checked_in_at)]),
    styles: { fontSize: 9, cellPadding: 4 },
    headStyles: { fillColor: [11, 24, 56], textColor: [232, 190, 92], fontStyle: 'bold' },
    alternateRowStyles: { fillColor: [247, 248, 252] },
    columnStyles: { 0: { cellWidth: 30, halign: 'right' } },
    didParseCell: (d) => {
      if (d.section === 'body' && d.column.index === 4) {
        d.cell.styles.textColor = d.cell.raw === 'Present' ? [21, 128, 61] : [185, 28, 28];
        d.cell.styles.fontStyle = 'bold';
      }
    },
    didDrawPage: () => {
      const H = doc.internal.pageSize.getHeight();
      doc.setFontSize(8); doc.setTextColor(120, 120, 120);
      doc.text(`Page ${doc.getNumberOfPages()}`, W - 70, H - 18);
      doc.text('PGB HR Service Delivery — Confidential', 36, H - 18);
    },
  });
  doc.save(`PGB-Christmas-Party-Attendance-${fileStamp()}.pdf`);
}

/* --------------------------- Masterlist upload --------------------------- */
const HEADER_MAP = {
  employeeid: 'employee_code', empid: 'employee_code', employeeno: 'employee_code', employeenumber: 'employee_code',
  idno: 'employee_code', idnumber: 'employee_code', id: 'employee_code', employeecode: 'employee_code',
  lastname: 'last_name', surname: 'last_name', familyname: 'last_name',
  firstname: 'first_name', givenname: 'first_name',
  affiliate: 'affiliate', company: 'affiliate', affiliatename: 'affiliate',
  department: 'department', dept: 'department',
};
const REQUIRED = ['employee_code', 'last_name', 'first_name', 'affiliate'];
const normH = (v) => String(v ?? '').toLowerCase().replace(/[^a-z0-9]/g, '');
const clean = (v) => String(v ?? '').replace(/\s+/g, ' ').trim();

async function parseMasterlist(file) {
  await loadScript(LIBS.xlsx);
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
  const ws = wb.Sheets[wb.SheetNames[0]];
  const grid = XLSX.utils.sheet_to_json(ws, { header: 1, defval: '', raw: false, blankrows: false });
  let headerIdx = -1, map = {};
  for (let i = 0; i < Math.min(grid.length, 15); i++) {
    const m = {};
    grid[i].forEach((cell, c) => { const k = HEADER_MAP[normH(cell)]; if (k && m[k] === undefined) m[k] = c; });
    if (REQUIRED.every((k) => m[k] !== undefined)) { headerIdx = i; map = m; break; }
  }
  if (headerIdx < 0) return { rows: [], errors: ['Header row not found. Required columns: Employee ID, Last Name, First Name, Affiliate (Department optional).'] };
  const rows = [], errors = [], seen = new Set();
  for (let i = headerIdx + 1; i < grid.length; i++) {
    const r = grid[i];
    const get = (k) => (map[k] === undefined ? '' : clean(r[map[k]]));
    const row = { employee_code: get('employee_code').toUpperCase(), last_name: get('last_name'), first_name: get('first_name'), affiliate: get('affiliate'), department: get('department') || null };
    if (!row.employee_code && !row.last_name && !row.first_name && !row.affiliate) continue;
    const missing = REQUIRED.filter((k) => !row[k]);
    if (missing.length) { errors.push(`Row ${i + 1}: missing ${missing.join(', ').replace(/_/g, ' ')}`); continue; }
    if (seen.has(row.employee_code)) { errors.push(`Row ${i + 1}: duplicate Employee ID ${row.employee_code} (skipped)`); continue; }
    seen.add(row.employee_code); rows.push(row);
  }
  return { rows, errors };
}

/* --------------------------- Monitoring personnel --------------------------- */
const STAFF_HEADERS = {
  name: 'full_name', fullname: 'full_name', personnel: 'full_name', personnelname: 'full_name', employeename: 'full_name',
  email: 'email', emailaddress: 'email', companyemail: 'email', workemail: 'email',
  role: 'role', access: 'role', accesslevel: 'role', position: 'role',
  affiliate: 'affiliate', assignedaffiliate: 'affiliate', assignment: 'affiliate', company: 'affiliate',
};
const EMAIL_RE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
const normRole = (v) => (/admin/i.test(String(v || '')) ? 'admin' : 'monitor');
const normAff = (v) => { const a = clean(v); return !a || /^(all|any|-|n\/?a)$/i.test(a) ? null : a; };

async function parseStaffFile(file) {
  await loadScript(LIBS.xlsx);
  const wb = XLSX.read(await file.arrayBuffer(), { type: 'array' });
  const grid = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '', raw: false, blankrows: false });
  let hi = -1, map = {};
  for (let i = 0; i < Math.min(grid.length, 15); i++) {
    const m = {};
    grid[i].forEach((cell, c) => { const k = STAFF_HEADERS[normH(cell)]; if (k && m[k] === undefined) m[k] = c; });
    if (m.email !== undefined) { hi = i; map = m; break; }
  }
  if (hi < 0) return { rows: [], errors: ['Header row not found. Required column: Email. Optional: Name, Role (Admin / Monitor), Affiliate.'] };
  const rows = [], errors = [], seen = new Set();
  for (let i = hi + 1; i < grid.length; i++) {
    const get = (k) => (map[k] === undefined ? '' : clean(grid[i][map[k]]));
    const email = get('email').toLowerCase();
    if (!email && !get('full_name')) continue;
    if (!EMAIL_RE.test(email)) { errors.push(`Row ${i + 1}: invalid or missing email "${email}"`); continue; }
    if (seen.has(email)) { errors.push(`Row ${i + 1}: duplicate email ${email} (skipped)`); continue; }
    seen.add(email);
    rows.push({ email, full_name: get('full_name') || null, role: normRole(get('role')), affiliate: normAff(get('affiliate')), active: true });
  }
  return { rows, errors };
}

  const instructions = `Hi! You're assigned as monitoring personnel for the ${CONFIG.EVENT_SUBTITLE} (${CONFIG.EVENT_DATE}).\n\n1. Open: ${loginLink}\n2. Tap "First time? Create your account"\n3. Use your work email and choose a password\n4. Sign in to see live attendance.`;
  const copy = async (text, btn) => { try { await navigator.clipboard.writeText(text); btn.textContent = 'Copied ✓'; } catch (_) { prompt('Copy this:', text); } };
  $('#copyLogin').onclick = (e) => copy(loginLink, e.target);
  $('#copyMsg').onclick = (e) => copy(instructions, e.target);

  load();
}

/* --------------------------- Raffle (wheel of names) --------------------------- */
const RAFFLE_KEY = 'pgb-raffle-winners';
function loadWinners() { try { return JSON.parse(localStorage.getItem(RAFFLE_KEY) || '[]'); } catch (_) { return []; } }
function saveWinners(w) { try { localStorage.setItem(RAFFLE_KEY, JSON.stringify(w)); } catch (_) {} }
function randomInt(n) { const a = new Uint32Array(1); crypto.getRandomValues(a); return a[0] % n; }

async function renderRaffle(main) {
  const myRoute = routeId;
  main.innerHTML = `
    <div class="page-title">
      <h1>Raffle 🎁</h1>
      <span class="live" id="rcount">…</span>
      <button class="btn btn-outline btn-sm" id="rReload" title="Add guests who checked in since this page opened">↻ Refresh names</button>
    </div>
    <div id="rmsg"></div>
    <div class="raffle-grid">
      <section class="wheel-stage">
        <div class="wheel-wrap"><div class="wheel-pointer"></div><canvas id="wheel"></canvas></div>
        <div class="wheel-ticker" id="ticker">&nbsp;</div>
        <button class="btn btn-gold spin-btn" id="spin" disabled>SPIN</button>
      </section>
      <div style="display:grid;gap:18px">
        <section class="panel">
          <div class="panel-head"><h3>Who is in the draw</h3></div>
          <div class="panel-body" style="display:grid;gap:12px">
            <div><label class="label" for="rAff">Affiliate</label>
              <select class="select" id="rAff"><option value="All">All affiliates</option></select></div>
            <label style="display:flex;gap:8px;align-items:center;font-size:14px">
              <input type="checkbox" id="rAll"> Include everyone invited (not only present)</label>
            <label style="display:flex;gap:8px;align-items:center;font-size:14px">
              <input type="checkbox" id="rRemove" checked> Remove each winner from the wheel</label>
            <p style="margin:0;font-size:13px;color:var(--muted)" id="rHint">Only employees marked <b>Present</b> are on the wheel.</p>
          </div>
        </section>
        <section class="panel">
          <div class="panel-head"><h3>Winners <span id="wcount" style="color:var(--muted);font-weight:500"></span></h3>
            <button class="btn btn-outline btn-sm" id="wCopy">Copy</button>
            <button class="btn btn-danger btn-sm" id="wReset">Reset</button></div>
          <ul class="winners" id="wlist"></ul>
        </section>
      </div>
    </div>`;

  const COLORS = ['#0b1838', '#d4a537', '#8b1e2d', '#14532d', '#1d3470', '#a87b1c'];
  const canvas = $('#wheel'), ctx = canvas.getContext('2d');
  let everyone = [], present = [], pool = [], winners = loadWinners(), rot = 0, spinning = false;
  const label = (e) => fullName(e);

  const rebuild = () => {
    const aff = $('#rAff').value, won = new Set(winners.map((w) => w.id));
    const base = $('#rAll').checked ? everyone : present;
    $('#rHint').innerHTML = $('#rAll').checked ? 'Everyone in the masterlist is on the wheel, even if not checked in.' : 'Only employees marked <b>Present</b> are on the wheel.';
    pool = base.filter((e) => (aff === 'All' || e.affiliate === aff) && !($('#rRemove').checked && won.has(e.id)));
    $('#rcount').textContent = `${pool.length} name${pool.length === 1 ? '' : 's'} in the draw`;
    $('#spin').disabled = spinning || pool.length < 1;
    draw(); drawWinners(); tick();
  };

  function draw() {
    const css = canvas.clientWidth || 500, dpr = window.devicePixelRatio || 1;
    if (canvas.width !== Math.round(css * dpr)) { canvas.width = canvas.height = Math.round(css * dpr); }
    const W = canvas.width, R = W / 2 - 6 * dpr, c = W / 2;
    ctx.clearRect(0, 0, W, W);
    ctx.save(); ctx.translate(c, c);
    // rim
    ctx.beginPath(); ctx.arc(0, 0, R + 4 * dpr, 0, Math.PI * 2); ctx.fillStyle = '#d4a537'; ctx.fill();
    const n = pool.length;
    if (!n) {
      ctx.beginPath(); ctx.arc(0, 0, R, 0, Math.PI * 2); ctx.fillStyle = '#0b1838'; ctx.fill();
      ctx.fillStyle = '#f3d27a'; ctx.font = `600 ${16 * dpr}px Inter,sans-serif`; ctx.textAlign = 'center';
      ctx.fillText('No checked-in names yet', 0, 6 * dpr);
    } else {
      const big = n > 120, slices = big ? 24 : n; // big lists: neat sections, name shows below the wheel
      const seg = (Math.PI * 2) / slices;
      const showText = !big, fs = Math.max(8, Math.min(18, (seg * R * 0.55) / dpr)) * dpr;
      for (let i = 0; i < slices; i++) {
        const a0 = rot + i * seg - Math.PI / 2, col = COLORS[slices % COLORS.length === 1 && i === slices - 1 ? 2 : i % COLORS.length];
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, R, a0, a0 + seg); ctx.closePath();
        ctx.fillStyle = col; ctx.fill();
        if (slices <= 300) { ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 1 * dpr; ctx.stroke(); }
        if (showText) {
          ctx.save(); ctx.rotate(a0 + seg / 2);
          ctx.fillStyle = col === '#d4a537' || col === '#a87b1c' ? '#0b1838' : '#fff';
          ctx.font = `700 ${fs}px Inter,sans-serif`; ctx.textAlign = 'right'; ctx.textBaseline = 'middle';
          let t = label(pool[i]); const maxW = R * 0.66;
          while (t.length > 3 && ctx.measureText(t).width > maxW) t = t.slice(0, -2) + '…';
          ctx.fillText(t, R - 14 * dpr, 0); ctx.restore();
        }
      }
    }
    // hub
    ctx.beginPath(); ctx.arc(0, 0, R * 0.14, 0, Math.PI * 2); ctx.fillStyle = '#010b26'; ctx.fill();
    ctx.lineWidth = 4 * dpr; ctx.strokeStyle = '#d4a537'; ctx.stroke();
    ctx.fillStyle = '#f3d27a'; ctx.font = `800 ${R * 0.09}px Inter,sans-serif`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('75', 0, 1 * dpr);
    ctx.restore();
  }

  const indexAtPointer = () => {
    const n = pool.length; if (!n) return -1;
    const seg = (Math.PI * 2) / n, a = (((-rot) % (Math.PI * 2)) + Math.PI * 2) % (Math.PI * 2);
    return Math.floor(a / seg) % n;
  };
  function tick() {
    const i = indexAtPointer();
    $('#ticker').innerHTML = i < 0 ? '&nbsp;' : `${esc(label(pool[i]))}<small>${esc(pool[i].affiliate)}</small>`;
  }

  function drawWinners() {
    $('#wcount').textContent = winners.length ? `(${winners.length})` : '';
    $('#wlist').innerHTML = winners.length
      ? winners.map((w, i) => `<li><span class="n">${i + 1}</span><b>${esc(w.name)}</b><span style="color:var(--muted);font-size:13px">${esc(w.affiliate)}</span></li>`).join('')
      : '<li style="color:var(--muted)">No winners yet. Press SPIN!</li>';
  }

  function showWinner(e) {
    const colors = ['#d4a537', '#f3d27a', '#ffffff', '#8b1e2d', '#14532d'];
    const el = document.createElement('div');
    el.className = 'result winner-modal'; el.setAttribute('role', 'dialog');
    el.innerHTML = `<div class="confetti" aria-hidden="true">${Array.from({ length: 90 }, () =>
        `<i style="left:${Math.random() * 100}%;background:${colors[(Math.random() * colors.length) | 0]};animation-delay:${Math.random() * 1.2}s;transform:rotate(${Math.random() * 360}deg)"></i>`).join('')}</div>
      <div class="result-inner">
        <h1 class="rise d1">Congratulations!</h1>
        <div class="who rise d2">${esc(label(e))}</div>
        <div class="aff rise d2">${esc(e.affiliate)}${e.employee_code ? ' · ' + esc(e.employee_code) : ''}</div>
        <div class="rise d4" style="margin-top:22px"><button class="btn btn-gold" id="wClose">Continue</button></div>
      </div>`;
    document.body.appendChild(el);
    $('#wClose', el).onclick = () => { el.remove(); rebuild(); };
  }

  $('#spin').onclick = () => {
    if (spinning || !pool.length) return;
    spinning = true; $('#spin').disabled = true; $('#rAff').disabled = $('#rRemove').disabled = $('#rAll').disabled = true;
    const n = pool.length, seg = (Math.PI * 2) / n, w = randomInt(n);
    const jitter = (Math.random() - 0.5) * seg * 0.7;
    const target = -((w + 0.5) * seg + jitter);
    const TWO = Math.PI * 2, start = rot;
    const delta = ((((target - start) % TWO) + TWO) % TWO) + TWO * (6 + randomInt(3));
    const dur = 6500, t0 = performance.now();
    const ease = (t) => 1 - Math.pow(1 - t, 4);
    const step = (now) => {
      if (myRoute !== routeId) return;
      const t = Math.min(1, (now - t0) / dur);
      rot = start + delta * ease(t); draw(); tick();
      if (t < 1) return requestAnimationFrame(step);
      rot %= TWO; spinning = false; $('#rAff').disabled = $('#rRemove').disabled = $('#rAll').disabled = false;
      const e = pool[w];
      winners.push({ id: e.id, name: label(e), affiliate: e.affiliate, code: e.employee_code || '', at: new Date().toISOString() });
      saveWinners(winners); drawWinners();
      showWinner(e);
    };
    requestAnimationFrame(step);
  };
  $('#rAff').onchange = rebuild;
  $('#rRemove').onchange = rebuild;
  $('#rAll').onchange = rebuild;
  $('#wReset').onclick = () => {
    if (!winners.length || !confirm('Clear the winners list? Everyone who is present goes back on the wheel.')) return;
    winners = []; saveWinners(winners); rebuild();
  };
  $('#wCopy').onclick = async (ev) => {
    const text = winners.map((w, i) => `${i + 1}. ${w.name} — ${w.affiliate}${w.code ? ' (' + w.code + ')' : ''}`).join('\n');
    try { await navigator.clipboard.writeText(text || 'No winners yet'); ev.target.textContent = 'Copied ✓'; } catch (_) {}
  };
  const onResize = () => draw();
  window.addEventListener('resize', onResize);
  cleanup = () => window.removeEventListener('resize', onResize);

  async function load() {
    $('#rcount').textContent = 'Loading…';
    try {
      const rows = await fetchAll(() => sb.rpc('admin_employees', { p_pin: getPin() }));
      if (myRoute !== routeId) return;
      everyone = rows.slice().sort((a, b) => fullName(a).localeCompare(fullName(b)));
      present = everyone.filter((e) => e.status === 'Present');
      const affs = [...new Set(everyone.map((e) => e.affiliate))].sort();
      const cur = $('#rAff').value;
      $('#rAff').innerHTML = '<option value="All">All affiliates</option>' + affs.map((a) => `<option ${a === cur ? 'selected' : ''}>${esc(a)}</option>`).join('');
      $('#rmsg').innerHTML = '';
      rebuild();
    } catch (e) {
      $('#rmsg').innerHTML = `<div class="alert alert-error">Could not load names: ${esc(e.message || e)}</div>`;
    }
  }
  $('#rReload').onclick = () => { if (!spinning) load(); };
  draw(); drawWinners();
  load();
}

/* --------------------------- QR code --------------------------- */
async function renderQr(main) {
  const url = guestUrl();
  main.innerHTML = `
    <div class="page-title no-print">
      <h1>Event QR Code</h1>
      <a class="btn btn-outline btn-sm" id="dl" download="PGB-Christmas-Party-CheckIn-QR.png">⬇ Download PNG</a>
      <button class="btn btn-gold btn-sm" onclick="window.print()">🖨 Print poster</button>
    </div>
    <section class="panel no-print">
      <div class="panel-body" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <div class="url-box">${esc(url)}</div>
        <button class="btn btn-outline btn-sm" id="copyUrl">Copy link</button>
      </div>
      ${!CONFIG.SITE_URL ? `<div class="alert alert-info" style="margin:0 18px 18px">This QR uses the address of this site. Open this page from the final hosted link before printing (or set <code>SITE_URL</code> in the file) so the code never points to a local file.</div>` : ''}
    </section>
    <div class="qr-poster">
      <img class="bn" src="${BANNER}" alt="">
      <div class="qr-box" id="qrBox">${spinner}</div>
    </div>`;
  $('#copyUrl').onclick = async (e) => { await navigator.clipboard.writeText(url); e.target.textContent = 'Copied ✓'; };
  try {
    await loadScript(LIBS.qr);
    const qr = qrcode(0, 'H'); qr.addData(url); qr.make();
    const n = qr.getModuleCount(), cell = Math.max(8, Math.floor(1200 / (n + 4))), margin = cell * 2;
    const c = document.createElement('canvas'); c.width = c.height = n * cell + margin * 2;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.fillStyle = '#0b1838';
    for (let r = 0; r < n; r++) for (let col = 0; col < n; col++) if (qr.isDark(r, col)) ctx.fillRect(margin + col * cell, margin + r * cell, cell, cell);
    const png = c.toDataURL('image/png');
    $('#qrBox').innerHTML = `<img src="${png}" alt="QR code for ${esc(url)}">`;
    $('#dl').href = png;
  } catch (e) {
    $('#qrBox').innerHTML = `<div class="alert alert-error">${esc(e.message)}</div>`;
  }
}

route();
</script>
